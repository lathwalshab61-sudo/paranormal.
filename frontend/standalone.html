                      <div className="p-4 space-y-2">
                        <span className="font-mono text-[10px] text-secondary">{loc.distance}</span>
                        <h2 className="font-bold text-lg">{loc.title}</h2>
                        <p className="text-xs text-on-surface-variant">{loc.subtitle}</p>
                        <p className="text-xs text-outline">{loc.description}</p>
                        <button onClick={() => navigateTo('detail', loc.id)} className="w-full py-2 bg-secondary/20 text-secondary border border-secondary/40 rounded text-xs font-mono uppercase mt-2">
                          Access Dossier & Blueprint
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* LOCATION DETAIL DOSSIER VIEW */}
            {currentRoute === 'detail' && (
              <div className="space-y-4">
                <button onClick={() => navigateTo('locations')} className="text-secondary font-mono text-xs flex items-center gap-1">
                  ← Back to Directory
                </button>
                {(() => {
                  const loc = locationsData.find(l => l.id === selectedLocationId) || locationsData[0];
                  return (
                    <div className="rounded-xl bg-surface-container overflow-hidden border border-outline-variant/30 p-6 space-y-4">
                      <img src={loc.image} alt={loc.title} className="w-full h-64 object-cover rounded-lg" />
                      <div>
                        <span className="px-2 py-0.5 rounded bg-tertiary-container text-white font-mono text-[10px] font-bold">
                          {loc.threatLevel}
                        </span>
                        <h1 className="text-2xl font-bold uppercase mt-2">{loc.title}</h1>
                        <p className="text-xs text-secondary font-mono">{loc.coordinates}</p>
                      </div>
                      <p className="text-sm text-on-surface-variant leading-relaxed">{loc.description}</p>
                      <div className="p-4 bg-surface-container-low rounded-lg border border-primary/30 space-y-2">
                        <span className="font-mono text-xs text-primary font-bold uppercase">MANDATORY PROTOCOL</span>
                        <p className="text-xs text-outline">{loc.containmentProtocol}</p>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* TOOLS / SENSORS VIEW */}
            {currentRoute === 'tools' && (
              <div className="space-y-4">
                <h1 className="text-2xl font-bold uppercase">Hardware Sensors Suite</h1>
                <div className="p-6 rounded-xl bg-surface-container border border-outline-variant/30 text-center space-y-4">
                  <span className="font-mono text-xs text-outline uppercase">NATURAL EMF MAGNETIC FLUX</span>
                  <div className="text-6xl font-mono font-bold text-primary">{telemetry.emf} mG</div>
                  <div className="w-full bg-surface-container-high h-3 rounded-full overflow-hidden">
                    <div className="bg-primary h-full transition-all duration-300" style={{ width: `${Math.min(100, telemetry.emf * 10)}%` }}></div>
                  </div>
                  <div className="flex justify-between font-mono text-xs text-outline pt-2">
                    <span>AMBIENT: {telemetry.thermal}°F</span>
                    <span>SWEEP: {telemetry.frequency} MHz</span>
                  </div>
                </div>
              </div>
            )}

            {/* OPS DASHBOARD VIEW */}
            {currentRoute === 'dashboard' && (
              <div className="space-y-4">
                <h1 className="text-2xl font-bold uppercase">Operations Command</h1>
                <div className="rounded-xl bg-surface-container p-4 border border-outline-variant/30 space-y-3">
                  <span className="font-mono text-xs text-secondary font-bold">ACTIVE INCIDENT TICKER</span>
                  {incidents.map(inc => (
                    <div key={inc.id} className="p-3 rounded bg-surface-container-low border border-outline-variant/20 flex justify-between items-center text-xs">
                      <div>
                        <span className="font-bold text-primary mr-2 font-mono">{inc.id}</span>
                        <span className="font-bold text-on-surface">{inc.location}</span>
                        <div className="text-outline text-[11px]">{inc.type}</div>
                      </div>
                      <span className="font-mono text-tertiary">{inc.level}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* EVIDENCE VAULT VIEW */}
            {currentRoute === 'evidence' && (
              <div className="space-y-4">
                <h1 className="text-2xl font-bold uppercase">Evidence Vault Archive</h1>
                <div className="p-4 rounded-xl bg-surface-container border border-outline-variant/30 space-y-3">
                  <div className="flex justify-between items-center font-mono text-xs text-primary">
                    <span>ARCHIVE #489 • REVIEWED</span>
                    <span>CONFIDENCE 94.2%</span>
                  </div>
                  <h2 className="font-bold text-lg">Class-A EVP: St. Jude Quarantine Ward</h2>
                  <p className="text-xs text-on-surface-variant">
                    Phoneme cadence reveals distinct multi-syllabic phrase "Still here with you". Natural draft ruled out.
                  </p>
                </div>
              </div>
            )}

            {/* ABOUT VIEW */}
            {currentRoute === 'about' && (
              <div className="p-6 rounded-xl bg-surface-container border border-outline-variant/30 space-y-3">
                <h1 className="text-2xl font-bold uppercase">About BTU Division</h1>
                <p className="text-sm text-on-surface-variant leading-relaxed">
                  Beyond the Unknown (BTU) is an empirical scientific division chartered to investigate, categorize, and contain unexplained anomalous phenomena under ISO-17025 scientific standards.
                </p>
              </div>
            )}

            {/* SAFETY VIEW */}
            {currentRoute === 'safety' && (
              <div className="p-6 rounded-xl bg-surface-container border border-outline-variant/30 space-y-3">
                <h1 className="text-2xl font-bold uppercase text-tertiary">Class IV Containment Safety</h1>
                <p className="text-sm text-on-surface-variant">
                  Mandatory operational buddy system required. Exposure to fields exceeding 10 mG mandates immediate retreat.
                </p>
              </div>
            )}

            {/* CONTACT VIEW */}
            {currentRoute === 'contact' && (
              <div className="p-6 rounded-xl bg-surface-container border border-outline-variant/30 space-y-3">
                <h1 className="text-2xl font-bold uppercase text-primary">Encrypted Dispatch Uplink</h1>
                <p className="text-sm text-on-surface-variant font-mono">
                  Channel: 142.800 MHz • 256-Bit AES Active Relay
                </p>
              </div>
            )}
          </main>

          {/* Bottom Navigation */}
          <nav className="fixed bottom-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-2xl border-t border-outline-variant/30 pb-safe">
            <div className="max-w-md mx-auto flex justify-between items-center h-20 px-4">
              {[
                { id: 'home', label: 'Home', icon: 'radar' },
                { id: 'locations', label: 'Locs', icon: 'explore' },
                { id: 'tools', label: 'Tools', icon: 'sensors' },
                { id: 'dashboard', label: 'Ops', icon: 'emergency' },
                { id: 'evidence', label: 'Vault', icon: 'inventory_2' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => navigateTo(item.id)}
                  className={`flex flex-col items-center justify-center gap-1 w-14 h-14 ${
                    currentRoute === item.id ? 'text-primary' : 'text-on-surface-variant hover:text-on-surface'
                  }`}
                >
                  <span className="material-symbols-outlined text-[22px]">{item.icon}</span>
                  <span className="font-mono text-[10px] uppercase">{item.label}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
