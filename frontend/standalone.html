                            <option value="SEC-LEVEL 4">SEC-LEVEL 4 (Lead)</option>
                          </select>
                        </div>
                        <div>
                          <label className="font-mono text-[10px] text-outline uppercase block mb-1">Badge ID</label>
                          <input
                            type="text"
                            value={authForm.badgeNumber}
                            onChange={(e) => setAuthForm({ ...authForm, badgeNumber: e.target.value })}
                            placeholder="BTU-XXXX (Auto)"
                            className="w-full p-2.5 rounded-lg bg-surface-container-low border border-outline-variant/30 text-on-surface font-mono text-xs focus:outline-none focus:border-primary"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div>
                          <label className="font-mono text-[10px] text-outline uppercase block mb-1">Passkey</label>
                          <input
                            type="password"
                            value={authForm.signupPassword}
                            onChange={(e) => setAuthForm({ ...authForm, signupPassword: e.target.value })}
                            placeholder="Min 6 chars"
                            className="w-full p-2.5 rounded-lg bg-surface-container-low border border-outline-variant/30 text-on-surface font-mono text-xs focus:outline-none focus:border-primary"
                            required
                          />
                        </div>
                        <div>
                          <label className="font-mono text-[10px] text-outline uppercase block mb-1">Confirm Passkey</label>
                          <input
                            type="password"
                            value={authForm.confirmPassword}
                            onChange={(e) => setAuthForm({ ...authForm, confirmPassword: e.target.value })}
                            placeholder="Re-type passkey"
                            className="w-full p-2.5 rounded-lg bg-surface-container-low border border-outline-variant/30 text-on-surface font-mono text-xs focus:outline-none focus:border-primary"
                            required
                          />
                        </div>
                      </div>

                      <label className="flex items-start gap-2 pt-1 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={authForm.acceptedProtocols}
                          onChange={(e) => setAuthForm({ ...authForm, acceptedProtocols: e.target.checked })}
                          className="mt-0.5 accent-primary"
                        />
                        <span className="font-mono text-[10px] text-outline">
                          I accept Class IV Containment safety guidelines & non-disclosure rules.
                        </span>
                      </label>

                      <button
                        type="submit"
                        className="w-full py-3 rounded-lg bg-gradient-to-r from-primary-container to-secondary text-white font-bold uppercase font-mono text-xs tracking-wider shadow-lg hover:brightness-110 active:scale-95 transition-all mt-2"
                      >
                        Register Clearance Credentials
                      </button>
                    </form>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* Bottom Navigation */}
          <nav className="fixed bottom-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-2xl border-t border-outline-variant/30 pb-safe">
            <div className="max-w-md mx-auto flex justify-between items-center h-20 px-4">
              {[
                { id: 'home', label: 'Home', icon: 'radar' },
                { id: 'locations', label: 'Locs', icon: 'explore' },
                { id: 'tools', label: 'Tools', icon: 'sensors' },
                { id: 'dashboard', label: 'Ops', icon: 'emergency' },
                { id: 'evidence', label: 'Vault', icon: 'inventory_2' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => navigateTo(item.id)}
                  className={`flex flex-col items-center justify-center gap-1 w-14 h-14 ${
                    currentRoute === item.id ? 'text-primary' : 'text-on-surface-variant hover:text-on-surface'
                  }`}
                >
                  <span className="material-symbols-outlined text-[22px]">{item.icon}</span>
                  <span className="font-mono text-[10px] uppercase">{item.label}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
